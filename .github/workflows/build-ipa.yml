name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Generate Xcode Project from Package.swift
        run: |
          # 自動從 Package.swift 產生 .xcodeproj
          swift package generate-xcodeproj || true

      - name: Build iOS Application (.app)
        run: |
          # 取得 Swift Package 產生的預設 Scheme 名稱並進行編譯
          xcodebuild build \
                     -scheme "AITerminalPro-Package" \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO || \
          xcodebuild build \
                     -scheme "AITerminalPro" \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          # 尋找 Release-iphoneos 目錄下編譯出的 .app 並打包
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r AI-Terminal-Pro.ipa Payload
          else
            echo "Error: .app bundle not found!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-Pro-IPA
          path: AI-Terminal-Pro.ipa
