name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build with SwiftPM for iOS
        run: |
          # 使用 swiftbuild 直接跨平台編譯 iOS Release 執行檔
          swift build -c release --triple arm64-apple-ios17.0

      - name: Package into .ipa
        run: |
          mkdir -p Payload/AITerminalPro.app
          
          # 尋找產出的 binary 檔
          EXECUTABLE=$(find .build -name "AITerminalPro" -type f | head -n 1)
          if [ -n "$EXECUTABLE" ]; then
            cp "$EXECUTABLE" Payload/AITerminalPro.app/
          fi
          
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/AITerminalPro.app/
          fi

          zip -r AI-Terminal-Pro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-Pro-IPA
          path: AI-Terminal-Pro.ipa
