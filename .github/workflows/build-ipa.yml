name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Swift Package for iOS
        run: |
          # 1. 使用 xcodebuild 針對 iOS 裝置編譯 SPM 專案
          xcodebuild build \
            -scheme "AITerminalPro" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || \
          xcodebuild build \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create iOS App Bundle & Package .ipa
        run: |
          # 2. 手動建立 iOS .app Payload 結構並封裝 .ipa
          mkdir -p Payload/AITerminalPro.app
          
          # 複製編譯出的執行檔與資源檔
          EXECUTABLE=$(find build/Build/Products -type f -name "AITerminalPro" | head -n 1)
          if [ -n "$EXECUTABLE" ]; then
            cp "$EXECUTABLE" Payload/AITerminalPro.app/
          fi
          
          # 複製 Info.plist
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/AITerminalPro.app/
          fi

          # 打包成 .ipa
          zip -r AI-Terminal-Pro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-Pro-IPA
          path: AI-Terminal-Pro.ipa
