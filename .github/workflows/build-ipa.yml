name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Generate Xcode Project
        run: |
          swift package generate-xcodeproj

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild build \
            -project AITerminalPro.xcodeproj \
            -scheme AITerminalPro-Package \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload/AITerminalPro.app
          
          # 尋找 Release-iphoneos 產出的 .app 或執行檔
          APP_DIR=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR"/* Payload/AITerminalPro.app/
          else
            EXECUTABLE=$(find build/Build/Products/Release-iphoneos -type f -name "AITerminalPro" | head -n 1)
            [ -n "$EXECUTABLE" ] && cp "$EXECUTABLE" Payload/AITerminalPro.app/
          fi
          
          [ -f "Info.plist" ] && cp Info.plist Payload/AITerminalPro.app/

          zip -r AI-Terminal-Pro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-Pro-IPA
          path: AI-Terminal-Pro.ipa
