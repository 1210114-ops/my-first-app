name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Swift Package for iOS
        run: |
          # 自動尋找 SPM 產生的 Target 並編譯
          xcodebuild build \
            -scheme "AITerminalPro" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create iOS App Bundle & Package .ipa
        run: |
          mkdir -p Payload/AITerminalPro.app
          
          # 抓取編譯產物
          EXECUTABLE=$(find ~/Library/Developer/Xcode/DerivedData -name "AITerminalPro" -type f | head -n 1)
          if [ -n "$EXECUTABLE" ]; then
            cp "$EXECUTABLE" Payload/AITerminalPro.app/
          fi
          
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/AITerminalPro.app/
          fi

          zip -r AI-Terminal-Pro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-Pro-IPA
          path: AI-Terminal-Pro.ipa
